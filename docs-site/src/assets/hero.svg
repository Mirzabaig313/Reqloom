<?xml version="1.0" encoding="UTF-8"?>
<!-- Hero illustration: a request graph with one resolved chain highlighted.
     Faint edges are the rest of the graph; the bright thread is the path the
     engine picked, terminating at the solid target node.

     Deliberately background-free and text-free — it sits on both the light
     Pearl Grey and dark Tidepool canvases without a plate behind it, and the
     page copy carries the labelling. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" width="560" height="380"
     fill="none" role="img"
     aria-label="A request dependency graph with one resolved execution chain highlighted.">
  <defs>
    <linearGradient id="h-thread" x1="60" y1="320" x2="500" y2="90"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2FBFCB"/>
      <stop offset="0.55" stop-color="#4FD4DA"/>
      <stop offset="1" stop-color="#8BEDF0"/>
    </linearGradient>
    <linearGradient id="h-target" x1="470" y1="70" x2="510" y2="110"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8BEDF0"/>
      <stop offset="1" stop-color="#18A6B4"/>
    </linearGradient>
    <radialGradient id="h-halo" cx="490" cy="90" r="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4FD4DA" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#4FD4DA" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Loom lattice: the schema the graph is woven on. -->
  <g stroke="#4FD4DA" stroke-width="1" opacity="0.1">
    <path d="M60 40V340M180 40V340M300 40V340M420 40V340M540 40V340"/>
    <path d="M20 90H540M20 170H540M20 250H540M20 330H540"/>
  </g>

  <!-- Unresolved edges: the rest of the dependency graph. -->
  <g stroke="#6E9AA2" stroke-width="1.5" opacity="0.32" stroke-linecap="round">
    <path d="M60 170C120 170 140 90 180 90"/>
    <path d="M180 250C230 250 250 330 300 330"/>
    <path d="M300 170C350 170 370 250 420 250"/>
    <path d="M420 250C450 250 465 210 480 190"/>
    <path d="M60 330C110 330 140 250 180 250"/>
    <path d="M180 90C240 90 250 170 300 170"/>
  </g>

  <!-- The resolved chain, in execution order. -->
  <path d="M60 330C120 330 150 250 180 250C230 250 250 170 300 170C355 170 375 90 420 90C450 90 468 90 486 90"
        stroke="url(#h-thread)" stroke-width="3" stroke-linecap="round"/>

  <!-- Direction markers along the chain. -->
  <g fill="#4FD4DA" opacity="0.85">
    <path d="M126 300l9 5-9 5z"/>
    <path d="M246 220l9 5-9 5z"/>
    <path d="M366 140l9 5-9 5z"/>
  </g>

  <!-- Graph nodes not on the chain. -->
  <g stroke="#6E9AA2" stroke-width="2" opacity="0.45">
    <circle cx="60" cy="170" r="9"/>
    <circle cx="300" cy="330" r="9"/>
    <circle cx="420" cy="250" r="9"/>
  </g>

  <!-- Chain nodes: hollow rings, resolved in order. -->
  <g stroke="url(#h-thread)" stroke-width="2.5">
    <circle cx="60" cy="330" r="11"/>
    <circle cx="180" cy="250" r="11"/>
    <circle cx="300" cy="170" r="11"/>
    <circle cx="420" cy="90" r="11"/>
  </g>
  <g fill="#4FD4DA">
    <circle cx="60" cy="330" r="3.5"/>
    <circle cx="180" cy="250" r="3.5"/>
    <circle cx="300" cy="170" r="3.5"/>
    <circle cx="420" cy="90" r="3.5"/>
  </g>

  <!-- Target operation: the endpoint the user actually asked for. -->
  <circle cx="490" cy="90" r="52" fill="url(#h-halo)"/>
  <circle cx="490" cy="90" r="17" fill="url(#h-target)"/>
  <circle cx="490" cy="90" r="26" stroke="#4FD4DA" stroke-width="1.5" opacity="0.5"/>
  <path d="M483 90l5 5 9-10" stroke="#0A2429" stroke-width="2.6"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
