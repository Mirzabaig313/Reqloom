<?xml version="1.0" encoding="UTF-8"?>
<!-- Reqloom mark: a loom. Two warp threads interlace two weft threads, with a
     4px gap wherever a thread passes under — that gap is what makes it read as
     weaving rather than as a hash symbol at favicon sizes. The solid node at
     the last crossing is the resolved target operation. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     fill="none" role="img" aria-label="Reqloom">
  <defs>
    <linearGradient id="rl-thread" x1="8" y1="8" x2="56" y2="56"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7DE6EA"/>
      <stop offset="1" stop-color="#0B8B99"/>
    </linearGradient>
  </defs>

  <g stroke="url(#rl-thread)" stroke-width="5" stroke-linecap="round">
    <!-- Warp, x=22: over the upper weft, under the lower weft. -->
    <path d="M22 8.5V37.5"/>
    <path d="M22 46.5V55.5"/>
    <!-- Warp, x=42: under the upper weft, then down through the node. -->
    <path d="M42 8.5V17.5"/>
    <path d="M42 26.5V55.5"/>
    <!-- Weft, y=22: under the first warp, over the second. -->
    <path d="M8.5 22H17.5"/>
    <path d="M26.5 22H55.5"/>
    <!-- Weft, y=42: over the first warp, running to the node. -->
    <path d="M8.5 42H55.5"/>
  </g>

  <!-- Resolved target: where the chain terminates. -->
  <circle cx="42" cy="42" r="9" fill="url(#rl-thread)"/>
  <circle cx="42" cy="42" r="3.2" fill="#F4FDFD" opacity="0.95"/>
</svg>
