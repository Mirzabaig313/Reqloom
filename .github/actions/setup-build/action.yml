name: Set up the Reqloom build
description: Compiler, CMake, Qt, vcpkg and a compiler cache, for the CLI or the desktop build.

inputs:
  desktop:
    description: "'true' installs what the desktop app needs; 'false' only what the engine and CLI need."
    required: true
  cache-key:
    description: Prefix of the compiler cache key, unique per pipeline and system.
    required: true
  portable-linux:
    description: "'true' when the job runs in the manylinux_2_28 container (AlmaLinux 8, GCC 14), which is how the Linux CLI is built to run on older systems. CLI only."
    default: "false"
  qt-version:
    description: Qt version to install.
    default: "6.8.3"
  vcpkg-commit:
    description: vcpkg commit to check out.
    default: aa40adda5352e87655b8583cfb2451d5e9e276fd

runs:
  using: composite
  steps:
    # The codebase uses <print>, which ubuntu-latest's default GCC 13 lacks.
    - name: Install Linux build prerequisites
      if: runner.os == 'Linux' && inputs.portable-linux != 'true'
      shell: bash
      env:
        DESKTOP: ${{ inputs.desktop }}
      run: |
        set -euo pipefail
        packages="gcc-14 g++-14 autoconf autoconf-archive automake libtool pkg-config ninja-build libsecret-1-dev ccache patchelf"
        if [[ "$DESKTOP" == "true" ]]; then
          packages="$packages libx11-dev libxext-dev libxrender-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libxcb-cursor-dev libxcb-glx0-dev libxcb-icccm4-dev libxcb-image0-dev \
            libxcb-keysyms1-dev libxcb-randr0-dev libxcb-render-util0-dev libxcb-shape0-dev \
            libxcb-shm0-dev libxcb-sync-dev libxcb-util-dev libxcb-xfixes0-dev libxcb-xinerama0-dev \
            libxcb-xkb-dev libxi-dev libgl1-mesa-dev libegl1-mesa-dev libfuse2 \
            libfontconfig1-dev libfreetype6-dev libdbus-1-dev"
        fi
        sudo apt-get update
        # shellcheck disable=SC2086
        sudo apt-get install -y --no-install-recommends $packages
        echo "CC=gcc-14" >> "$GITHUB_ENV"
        echo "CXX=g++-14" >> "$GITHUB_ENV"

    # A program built against an old glibc runs on newer ones, never the reverse.
    # This image pairs glibc 2.28 with GCC 14, which the code needs for <print>.
    - name: Install build prerequisites (manylinux container)
      if: runner.os == 'Linux' && inputs.portable-linux == 'true'
      shell: bash
      env:
        DESKTOP: ${{ inputs.desktop }}
      run: |
        set -euo pipefail
        if [[ "$DESKTOP" == "true" ]]; then
          echo "::error::portable-linux builds the CLI only"
          exit 1
        fi
        dnf install -y --setopt=install_weak_deps=False epel-release dnf-plugins-core
        dnf config-manager --set-enabled powertools || true
        dnf install -y --setopt=install_weak_deps=False \
          autoconf automake libtool pkgconf-pkg-config make perl git curl zip unzip tar which findutils sudo \
          kernel-headers libsecret-devel ccache patchelf
        dnf install -y --setopt=install_weak_deps=False autoconf-archive || true
        major="$(g++ -dumpversion | cut -d. -f1)"
        if [[ "$major" -lt 14 ]]; then
          echo "::error::the container's g++ is version $major; 14 or newer is required"
          exit 1
        fi
        echo "CC=gcc" >> "$GITHUB_ENV"
        echo "CXX=g++" >> "$GITHUB_ENV"
        # aqtinstall needs a current Python; the image keeps them under /opt/python.
        python_bin="$(ls -d /opt/python/cp3[0-9]*-cp3[0-9]*/bin | grep -v 't/bin$' | sort -V | tail -n 1)"
        [[ -x "$python_bin/python3" ]] || { echo "::error::no Python found under /opt/python"; exit 1; }
        echo "$python_bin" >> "$GITHUB_PATH"
        # The checkout belongs to another user id inside the container.
        git config --global --add safe.directory '*'

    # libb2's autoreconf step (pulled in by vcpkg) needs autoconf-archive.
    - name: Install macOS build prerequisites
      if: runner.os == 'macOS'
      shell: bash
      env:
        HOMEBREW_NO_AUTO_UPDATE: 1
        HOMEBREW_NO_INSTALL_CLEANUP: 1
        HOMEBREW_NO_ENV_HINTS: 1
      run: brew install --quiet autoconf-archive ccache

    - name: Install sccache (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: choco install sccache --no-progress -y

    - name: Set up CMake 4.x + Ninja
      uses: lukka/get-cmake@16e8153a8b4918849d92aad131befe67a3705daa  # latest, 2026-11-16
      with:
        cmakeVersion: "~4.0.0"

    # Linux needs the icu archive: Qt's own tools, which QtKeychain's CMake runs
    # at configure time, link libicui18n at run time.
    - name: Install Qt for the desktop app (Linux)
      if: runner.os == 'Linux' && inputs.desktop == 'true'
      uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06  # v4.5.0
      with:
        version: ${{ inputs.qt-version }}
        archives: qtbase qtdeclarative qtsvg icu
        modules: qt5compat
        cache: true

    - name: Install Qt for the desktop app (Windows / macOS)
      if: runner.os != 'Linux' && inputs.desktop == 'true'
      uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06  # v4.5.0
      with:
        version: ${{ inputs.qt-version }}
        archives: qtbase qtdeclarative qtsvg
        modules: qt5compat
        cache: true

    - name: Install Qt for the CLI (Linux)
      if: runner.os == 'Linux' && inputs.desktop != 'true'
      uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06  # v4.5.0
      with:
        version: ${{ inputs.qt-version }}
        archives: qtbase icu
        cache: true
        # The container brings its own Python; setup-python supports only the runner images.
        setup-python: ${{ inputs.portable-linux != 'true' }}
        # The action's own dependency step runs "sudo apt-get", which the container
        # (root, dnf) has neither of; the step above installed what is needed.
        install-deps: ${{ inputs.portable-linux != 'true' }}

    - name: Install Qt for the CLI (Windows / macOS)
      if: runner.os != 'Linux' && inputs.desktop != 'true'
      uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06  # v4.5.0
      with:
        version: ${{ inputs.qt-version }}
        archives: qtbase
        cache: true

    - name: Export CMAKE_PREFIX_PATH for Qt
      shell: bash
      run: echo "CMAKE_PREFIX_PATH=${QT_ROOT_DIR}" >> "$GITHUB_ENV"

    - name: Drop Qt's stale AGL reference (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -euo pipefail
        cd "${QT_ROOT_DIR}"
        # No mapfile/readarray: macOS ships bash 3.2.
        files="$(grep -rl -- 'AGL' lib/cmake mkspecs 2>/dev/null || true)"
        if [[ -z "${files}" ]]; then
          echo "No AGL references found."
          exit 0
        fi
        printf '%s\n' "${files}" | while IFS= read -r f; do
          [[ -n "${f}" ]] || continue
          echo "patching ${f}"
          perl -pi -e 's/-framework\s+AGL//g; s/;AGL(?=[;"\s])/;/g; s/(?<=[;"\s])AGL;/;/g' "${f}"
        done
        if grep -rq -- "-framework AGL" lib/cmake mkspecs 2>/dev/null; then
          echo "::error::AGL reference still present after patching"
          exit 1
        fi

    - name: Set up MSVC environment
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1
      with:
        arch: x64

    - name: Set up vcpkg
      uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2  # v11.6
      with:
        vcpkgGitCommitId: ${{ inputs.vcpkg-commit }}

    # CMake reads the launcher variables from the environment at first configure.
    # sccache cannot cache MSVC objects that write to a shared PDB, hence Embedded.
    - name: Configure the compiler cache
      shell: bash
      run: |
        set -euo pipefail
        dir="${RUNNER_TEMP}/compiler-cache"
        mkdir -p "$dir"
        if [[ "${RUNNER_OS}" == "Windows" ]]; then
          launcher=sccache
          echo "SCCACHE_DIR=$dir" >> "$GITHUB_ENV"
          echo "REQLOOM_CMAKE_ARGS=-DCMAKE_POLICY_DEFAULT_CMP0141=NEW -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded" >> "$GITHUB_ENV"
        else
          launcher=ccache
          echo "CCACHE_DIR=$dir" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=1G" >> "$GITHUB_ENV"
          echo "REQLOOM_CMAKE_ARGS=" >> "$GITHUB_ENV"
        fi
        echo "CMAKE_C_COMPILER_LAUNCHER=$launcher" >> "$GITHUB_ENV"
        echo "CMAKE_CXX_COMPILER_LAUNCHER=$launcher" >> "$GITHUB_ENV"

    - name: Restore the compiler cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
      with:
        path: ${{ runner.temp }}/compiler-cache
        key: ${{ inputs.cache-key }}-${{ github.sha }}
        restore-keys: |
          ${{ inputs.cache-key }}-
