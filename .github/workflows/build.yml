name: Build & Test (Linux + Windows + macOS)

# All three platforms build here. macOS previously lived on Azure DevOps; it
# moved here once GitHub's Apple Silicon runners became available on the
# public-repo free tier, so there is one CI provider to reason about.
#
# Branch routing:
#   * push to dev  → *-debug   on all platforms (ASan/UBSan + tests)
#   * push to main → *-release on all platforms (-O2, build only)
#
# Qt 6.8 LTS comes from the official Qt mirror via aqtinstall (the
# jurplel/install-qt-action wrapper), NOT vcpkg — building qtbase from
# source took 45-90 min. vcpkg supplies only the small non-Qt deps.

on:
  push:
    branches: [main, dev]

env:
  VCPKG_COMMIT: aa40adda5352e87655b8583cfb2451d5e9e276fd
  QT_VERSION: 6.8.3
  # Cache built vcpkg packages in the GitHub Actions cache.
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  # ==========================================================================
  # Static checks — architectural boundary guard. Gates the heavy matrix.
  # (clang-format is enforced locally by tools/pre-push-check.sh, not in CI.)
  # ==========================================================================
  static-checks:
    name: Static Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Architectural boundary check
        run: ./tools/ci/boundary-check.sh

  # ==========================================================================
  # Build matrix — Linux + Windows. Preset chosen by branch.
  # ==========================================================================
  build:
    name: ${{ matrix.os }} / ${{ matrix.name }}
    needs: static-checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
          # Pinned to macos-14, not macos-latest: it is Apple Silicon (arm64)
          # and keeps an Xcode 15 SDK, which Qt 6.8 needs — see the AGL note on
          # the Xcode selection step below. Matches the release workflow's pin.
          - os: macos-14
            name: macos

    steps:
      - uses: actions/checkout@v4

      # ----- Resolve preset from branch -----------------------------------
      - name: Resolve preset
        id: preset
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            cfg=release
          else
            cfg=debug
          fi
          echo "value=${{ matrix.name }}-${cfg}" >> "$GITHUB_OUTPUT"
          echo "Selected preset: ${{ matrix.name }}-${cfg}"

      # ----- Linux build prerequisites ------------------------------------
      # GCC 14 is mandatory: the codebase uses <print> (std::println), which
      # libstdc++ ships only from GCC 14 onward. ubuntu-latest (24.04) defaults
      # to GCC 13, which has no <print> header. Install g++-14 and select it
      # via CC/CXX below so the CMake preset's compiler detection picks it up.
      - name: Install Linux build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-14 g++-14 \
            autoconf autoconf-archive automake libtool pkg-config \
            ninja-build \
            libsecret-1-dev \
            libx11-dev libxext-dev libxrender-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libxcb-cursor-dev libxcb-glx0-dev libxcb-icccm4-dev \
            libxcb-image0-dev libxcb-keysyms1-dev libxcb-randr0-dev \
            libxcb-render-util0-dev libxcb-shape0-dev libxcb-shm0-dev \
            libxcb-sync-dev libxcb-util-dev libxcb-xfixes0-dev \
            libxcb-xinerama0-dev libxcb-xkb-dev libxi-dev \
            libgl1-mesa-dev libegl1-mesa-dev \
            libfontconfig1-dev libfreetype6-dev libdbus-1-dev

      - name: Select GCC 14 (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"

      # ----- macOS build prerequisites ------------------------------------
      # The runner image ships autoconf, automake, libtool, pkg-config and
      # ninja. Only autoconf-archive is missing, and libb2's autoreconf step
      # (pulled in via vcpkg) needs it.
      - name: Install macOS build prerequisites
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
          HOMEBREW_NO_ENV_HINTS: 1
        run: brew install --quiet autoconf-archive

      # Qt 6.8's QtGui links -framework AGL, which the Xcode 16 / macOS 15 SDK
      # removed ("ld: framework 'AGL' not found"). Build against the newest
      # Xcode 15 SDK on the image, where AGL is still present.
      - name: Select Xcode 15 (macOS)
        if: runner.os == 'macOS'
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_15*.app | sort -V | tail -1)"

      # ----- CMake 4.x (all OSes) -----------------------------------------
      - name: Set up CMake 4.x + Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~4.0.0"

      # ----- Qt 6.8 via aqtinstall ----------------------------------------
      # install-qt-action puts Qt's bin on PATH and exports QT_ROOT_DIR.
      # We also export CMAKE_PREFIX_PATH explicitly below so CMakePresets
      # (which reads it from the environment) finds Qt6 deterministically.
      #
      # Linux needs the `icu` archive: Qt's own tools (qtpaths, used by
      # QtKeychain's CMake at configure time) link against libicui18n.so at
      # runtime. Windows/macOS bake ICU into the Qt libs, so they don't.
      - name: Install Qt (Linux)
        if: runner.os == 'Linux'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          archives: qtbase qtdeclarative qtsvg icu
          modules: qt5compat
          cache: true

      - name: Install Qt (Windows / macOS)
        if: runner.os != 'Linux'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          archives: qtbase qtdeclarative qtsvg
          modules: qt5compat
          cache: true

      - name: Export CMAKE_PREFIX_PATH for Qt
        shell: bash
        run: echo "CMAKE_PREFIX_PATH=${QT_ROOT_DIR}" >> "$GITHUB_ENV"

      # ----- MSVC environment (Windows) -----------------------------------
      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ----- vcpkg --------------------------------------------------------
      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}

      # ----- Configure / Build / Test -------------------------------------
      # install-qt-action sets Qt6_DIR / CMAKE_PREFIX_PATH via the QT_ROOT_DIR
      # it exports, and lukka/run-vcpkg sets VCPKG_ROOT. CMakePresets reads
      # both from the environment.
      # -DCMAKE_PREFIX_PATH on the command line overrides the Homebrew Qt path
      # baked into the macos-* presets for local dev, pointing at the
      # aqt-installed Qt instead. Harmless on Linux/Windows, whose presets read
      # the same value from the environment.
      - name: Configure
        shell: bash
        run: |
          cmake --preset ${{ steps.preset.outputs.value }} \
            -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR}"

      - name: Build
        run: cmake --build --preset ${{ steps.preset.outputs.value }}

      - name: Test
        if: endsWith(steps.preset.outputs.value, '-debug')
        run: ctest --preset ${{ steps.preset.outputs.value }}
